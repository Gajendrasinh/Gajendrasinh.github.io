# Checks the content, runs the tests, builds the site and publishes dist/ to GitHub Pages.
# In the repository settings choose Pages > Source > "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # While Pages > Source is still "Deploy from a branch", GitHub also publishes the repository's
  # raw files (the README) on every push, sometimes after this workflow. Running again once that
  # default build finishes keeps the real site on top. With Source set to "GitHub Actions" the
  # default build no longer runs and this trigger never fires.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
